apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      initContainers:
        - name: wait-for-redis-sentinels
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for s in $(echo "$REDIS_SENTINELS" | tr ',' ' '); do
                host=${s%:*}
                port=${s#*:}
                echo "Waiting for Redis Sentinel $host:$port";
                until nc -z "$host" "$port"; do
                  sleep 2;
                done;
              done
          env:
            - name: REDIS_SENTINELS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINELS
      containers:
        - name: logging
          image: logging-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: REDIS_MASTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_MASTER_NAME
            - name: REDIS_SENTINELS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINELS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
spec:
  selector:
    app: logging-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
