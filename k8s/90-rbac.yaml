apiVersion: v1
kind: ServiceAccount
metadata:
  name: facade-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: facade-discovery
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: facade-discovery-binding
subjects:
  - kind: ServiceAccount
    name: facade-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: facade-discovery
