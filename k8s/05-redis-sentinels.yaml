apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-sentinel-1
  template:
    metadata:
      labels:
        app: redis-sentinel-1
    spec:
      containers:
        - name: redis-sentinel
          image: bitnami/redis-sentinel:latest
          ports:
            - containerPort: 26379
          env:
            - name: REDIS_MASTER_SET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_MASTER_NAME
            - name: REDIS_MASTER_HOST
              value: redis-1
            - name: REDIS_MASTER_PORT_NUMBER
              value: "6379"
            - name: REDIS_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-1
spec:
  selector:
    app: redis-sentinel-1
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
